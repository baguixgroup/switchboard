# Your credits, free tiers and subscriptions.
#
# Switchboard combines this file with live balances (DeepSeek and OpenRouter expose them)
# and its own usage log to decide what to spend first, and to warn you before money or a
# free quota is lost. Most providers (OpenAI, Anthropic, xAI, Google) do NOT expose prepaid
# balances or promo expiry through their APIs, so enter those grants here once:
#
#   switchboard credits add --provider openai --type prepaid --amount 18 --expires 2026-12-31
#
# Types:
#   prepaid       money already paid / promo grants. Spent first as expiry approaches.
#   free_tier     a quota that resets (requests or tokens). Warned before unused quota resets.
#   subscription  a plan used through an official CLI (Claude Code, Codex, Copilot, Gemini CLI).
#   payg          pay-as-you-go with an optional monthly budget guard.
#
# reset: {every: day|week|month|5h|..., at: "HH:MM", weekday: mon, day: 1, tz: America/Los_Angeles}

low_balance_usd: 2.0
sources: []

