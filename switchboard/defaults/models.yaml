# Model catalog used by the router.
#
# Model line-ups and prices change monthly. Entries marked `verified: false` are seeds:
# run `switchboard models sync` on a machine with your keys. It lists the models each key
# can actually see, flags catalog IDs that do not exist, adds new ones, and pulls current
# prices from OpenRouter's public price list. Your edits go in models.yaml in the config
# folder (same format); they override these defaults by provider + id.
#
# price: [input, output] USD per 1M tokens (per_call: USD per request, for image models)
# q: overall quality 1-10; skills: per-category overrides
#   categories: chat code game_dev writing research reasoning data devops image_edit design_3d mobile_test
# efforts: the provider's native effort values, lowest to highest ([] = not configurable)
# features: tools vision image_gen fallbacks cli agentic local

models:
  # --- Anthropic (prices and IDs from Anthropic's current model table) ---
