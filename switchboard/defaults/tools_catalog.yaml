# Desktop and CLI tools Switchboard can detect, recommend and install per platform.
# Install commands only ever come from this file and only run when you approve them.
# On a Raspberry Pi, `sudo` commands need passwordless sudo for remote installs; otherwise
# Switchboard shows you the command to run yourself.

vscode:
  name: Visual Studio Code
  group: editor
  helps: [code, game_dev, devops, data]
  detect: {bin: [code], paths: {windows: ["%LOCALAPPDATA%/Programs/Microsoft VS Code/Code.exe"], macos: ["/Applications/Visual Studio Code.app"]}}
  install: {windows: "winget install -e --id Microsoft.VisualStudioCode", macos: "brew install --cask visual-studio-code", pi: "sudo apt-get install -y code", linux: "sudo snap install code --classic"}

unity_hub:
  name: Unity Hub
  helps: [game_dev]
  detect: {bin: [unityhub], paths: {windows: ["%PROGRAMFILES%/Unity Hub/Unity Hub.exe"], macos: ["/Applications/Unity Hub.app"]}}
  install: {windows: "winget install -e --id Unity.UnityHub", macos: "brew install --cask unity-hub"}
  unsupported: {pi: "The Unity Editor does not run on Raspberry Pi."}

photoshop:
  name: Adobe Photoshop
  group: image_editor
  helps: [image_edit]
  manual: true
  detect: {paths: {windows: ["%PROGRAMFILES%/Adobe/Adobe Photoshop*"], macos: ["/Applications/Adobe Photoshop*"]}}
  install: {windows: "Install from Adobe Creative Cloud: https://www.adobe.com/products/photoshop.html", macos: "Install from Adobe Creative Cloud: https://www.adobe.com/products/photoshop.html"}
  unsupported: {pi: "Photoshop does not run on Raspberry Pi; GIMP is the closest alternative."}

gimp:
  name: GIMP (free Photoshop alternative)
  group: image_editor
  helps: [image_edit]
  detect: {bin: [gimp, gimp-3.0, gimp-2.10], paths: {windows: ["%PROGRAMFILES%/GIMP*"], macos: ["/Applications/GIMP*.app"]}}
  install: {windows: "winget install -e --id GIMP.GIMP.3", macos: "brew install --cask gimp", pi: "sudo apt-get install -y gimp", linux: "sudo apt-get install -y gimp"}

blender:
  name: Blender
  helps: [design_3d, game_dev]
  detect: {bin: [blender], paths: {windows: ["%PROGRAMFILES%/Blender Foundation/Blender*"], macos: ["/Applications/Blender.app"]}}
  install: {windows: "winget install -e --id BlenderFoundation.Blender", macos: "brew install --cask blender", pi: "sudo apt-get install -y blender", linux: "sudo apt-get install -y blender"}

claude_desktop:
  name: Claude desktop app
  desktop: true
  helps: [writing, research]
  aliases: [claude, claude-app, claude desktop]
  installer: macos_app
  download_macos: "https://claude.ai/api/desktop/darwin/universal/dmg/latest/redirect"
  bundle_name: Claude.app
  bundle_ids: [com.anthropic.claudefordesktop]
  detect:
    app_names: [Claude, Claude Desktop]
    paths:
      macos: ["/Applications/Claude.app", "~/Applications/Claude.app"]
      windows: ["%LOCALAPPDATA%/AnthropicClaude/claude.exe", "%LOCALAPPDATA%/AnthropicClaude/app-*/claude.exe", "%LOCALAPPDATA%/Programs/Claude/Claude.exe"]
  install: {windows: "winget install --id Anthropic.Claude --exact --source winget --silent --disable-interactivity", macos: "Download, verify and install the official Claude app in ~/Applications"}
  unsupported: {pi: "Desktop installation is not automated on Raspberry Pi; Claude's Linux app requires Debian 12+ with a desktop. Use Claude Code or the web app here.", linux: "See https://support.claude.com/en/articles/10065433-install-claude-desktop for supported Linux packages."}

chatgpt_desktop:
  name: ChatGPT desktop app
  desktop: true
  helps: [writing, research]
  aliases: [chatgpt, chatgpt-app, chatgpt desktop]
  installer: macos_app
  download_macos: "https://persistent.oaistatic.com/codex-app-prod/Codex.dmg"
  bundle_name: ChatGPT.app
  windows_package: OpenAI.Codex
  download_windows:
    x64: https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix
    arm64: https://persistent.oaistatic.com/codex-app-prod/ChatGPT-arm64.msix
  bundle_ids: [com.openai.codex, com.openai.chat]
  agreements:
    windows:
      - {label: Microsoft Store transaction terms, url: "https://aka.ms/microsoft-store-terms-of-transaction"}
      - {label: Microsoft Store license terms, url: "https://aka.ms/microsoft-store-license"}
  detect:
    app_names: [ChatGPT, OpenAI.Codex]
    paths:
      macos: ["/Applications/ChatGPT.app", "~/Applications/ChatGPT.app"]
      windows: ["%LOCALAPPDATA%/Programs/ChatGPT/ChatGPT.exe", "%PROGRAMFILES%/ChatGPT/ChatGPT.exe"]
  install: {windows: "winget install --id 9PLM9XGG6VKS --exact --source msstore --silent --disable-interactivity", macos: "Download, verify and install the official ChatGPT app in ~/Applications"}
  unsupported: {pi: "Use ChatGPT's web app or the Codex CLI on Raspberry Pi.", linux: "Use ChatGPT's web app or the Codex CLI on Linux."}

node:
  name: Node.js (needed by most MCP servers)
  group: runtime
  helps: [code, devops]
  installer: node
  detect: {bin: [node], all_bins: [node, npm, npx]}
  install: {windows: "Download verified Node.js LTS from https://nodejs.org (npm/npx included)", macos: "Download verified Node.js LTS from https://nodejs.org (npm/npx included)", pi: "Download verified Node.js LTS from https://nodejs.org (npm/npx included)", linux: "Download verified Node.js LTS from https://nodejs.org (npm/npx included)"}

uv:
  name: uv (Python runner used by many MCP servers)
  group: runtime
  helps: [code]
  detect: {bin: [uv, uvx]}
  install: {windows: "winget install -e --id astral-sh.uv", macos: "brew install uv", pi: "curl -LsSf https://astral.sh/uv/install.sh | sh", linux: "curl -LsSf https://astral.sh/uv/install.sh | sh"}

git:
  name: Git
  group: vcs
  helps: [code, devops]
  detect: {bin: [git]}
  install: {windows: "winget install -e --id Git.Git", macos: "xcode-select --install", pi: "sudo apt-get install -y git", linux: "sudo apt-get install -y git"}

gh:
  name: GitHub CLI
  group: vcs
  helps: [code, devops]
  detect: {bin: [gh]}
  install: {windows: "winget install -e --id GitHub.cli", macos: "brew install gh", pi: "sudo apt-get install -y gh", linux: "sudo apt-get install -y gh"}

adb:
  name: Android platform tools (adb)
  helps: [mobile_test]
  detect: {bin: [adb]}
  install: {windows: "winget install -e --id Google.PlatformTools", macos: "brew install --cask android-platform-tools", pi: "sudo apt-get install -y adb", linux: "sudo apt-get install -y adb"}

scrcpy:
  name: scrcpy (mirror and control Android screens)
  helps: [mobile_test]
  detect: {bin: [scrcpy]}
  install: {windows: "winget install -e --id Genymobile.scrcpy", macos: "brew install scrcpy", pi: "sudo apt-get install -y scrcpy", linux: "sudo apt-get install -y scrcpy"}

xcode:
  name: Xcode (iOS builds, simulators, devices)
  helps: [mobile_test]
  manual: true
  detect: {paths: {macos: ["/Applications/Xcode.app"]}}
  install: {macos: "Install Xcode from the Mac App Store, then run: sudo xcode-select -s /Applications/Xcode.app"}
  unsupported: {windows: "Xcode is macOS only.", pi: "Xcode is macOS only.", linux: "Xcode is macOS only."}

ffmpeg:
  name: FFmpeg
  helps: [image_edit, data]
  detect: {bin: [ffmpeg]}
  install: {windows: "winget install -e --id Gyan.FFmpeg", macos: "brew install ffmpeg", pi: "sudo apt-get install -y ffmpeg", linux: "sudo apt-get install -y ffmpeg"}

rsync:
  name: rsync (fast deploys to servers)
  helps: [devops]
  detect: {bin: [rsync]}
  install: {macos: "brew install rsync", pi: "sudo apt-get install -y rsync", linux: "sudo apt-get install -y rsync"}
  unsupported: {windows: "Switchboard falls back to scp on Windows."}

ollama:
  name: Ollama (free local models)
  helps: []
  detect: {bin: [ollama]}
  install: {windows: "winget install -e --id Ollama.Ollama", macos: "brew install ollama", pi: "curl -fsSL https://ollama.com/install.sh | sh", linux: "curl -fsSL https://ollama.com/install.sh | sh"}

claude_code:
  name: Claude Code CLI (uses your Claude plan)
  group: ai_cli
  requires: [node]
  helps: [code, game_dev, devops]
  detect: {bin: [claude]}
  install: {windows: "npm install -g @anthropic-ai/claude-code", macos: "npm install -g @anthropic-ai/claude-code", pi: "npm install -g @anthropic-ai/claude-code", linux: "npm install -g @anthropic-ai/claude-code"}

codex:
  name: OpenAI Codex CLI (uses your ChatGPT plan)
  group: ai_cli
  requires: [node]
  helps: [code, game_dev, devops]
  detect: {bin: [codex]}
  install: {windows: "npm install -g @openai/codex", macos: "npm install -g @openai/codex", pi: "npm install -g @openai/codex", linux: "npm install -g @openai/codex"}

gemini_cli:
  name: Gemini CLI (uses your Google account)
  group: ai_cli
  requires: [node]
  helps: [code, research]
  detect: {bin: [gemini]}
  install: {windows: "npm install -g @google/gemini-cli", macos: "npm install -g @google/gemini-cli", pi: "npm install -g @google/gemini-cli", linux: "npm install -g @google/gemini-cli"}

copilot_cli:
  name: GitHub Copilot CLI (uses your Copilot plan)
  group: ai_cli
  requires: [node]
  helps: [code, devops]
  detect: {bin: [copilot]}
  install: {windows: "npm install -g @github/copilot", macos: "npm install -g @github/copilot", pi: "npm install -g @github/copilot", linux: "npm install -g @github/copilot"}

grok_cli:
  name: Grok Build CLI (uses your SuperGrok plan)
  group: ai_cli
  helps: [code, research]
  manual: true
  detect: {bin: [grok]}
  install: {windows: "Install Grok Build from xAI's docs (docs.x.ai), then run: grok auth login", macos: "Install Grok Build from xAI's docs (docs.x.ai), then run: grok auth login", pi: "Install Grok Build from xAI's docs (docs.x.ai), then run: grok auth login", linux: "Install Grok Build from xAI's docs (docs.x.ai), then run: grok auth login"}
