agents:
  - id: coordinator
    name: Coordinator
    role: Planner
    model: ''
    instructions: Turn the goal and success criteria into a concrete execution plan. Identify assumptions, dependencies and what a successful deliverable must contain. Use supplied research when relevant.
  - id: researcher
    name: Researcher
    role: Research specialist
    model: ''
    instructions: Gather and compare the evidence supplied with the task. Distinguish observed facts from assumptions, preserve source references, and identify missing information. Do not invent research or tool results.
  - id: builder
    name: Builder
    role: Delivery specialist
    model: ''
    instructions: Produce the requested deliverable using the plan and evidence. Provide useful content or files rather than merely proposing future work. State material limitations and preserve source references.
  - id: reviewer
    name: Reviewer
    role: Quality reviewer
    model: ''
    instructions: Review the proposed deliverable against the goal and success criteria. Identify concrete errors, missing evidence and remaining risks. Return a clear acceptance recommendation; you cannot approve on the user's behalf.
blueprints:
  - id: managed-team
    name: Manager-led crew
    description: A manager proposes up to six assignments for named specialists. Review the plan before delegation, then approve the final handover.
    billing: plans_only
    max_cost_usd: 0
    nodes:
      - id: manager
        name: Manager proposes specialist assignments
        type: agent
        depends_on: []
        config:
          agent: coordinator
          tools: none
          revisions: 1
          contract: {format: team_plan, agents: [researcher, builder, reviewer]}
          expected: A JSON object with only a tasks array, containing 1–6 assignments. Each assignment has id (short identifier), agent (researcher, builder or reviewer), title, task, expected, and depends_on (task id list). All dependency ids must exist, with no cycles. Tools, budgets and permissions cannot be delegated.
          prompt: "Break this goal into the smallest useful crew. Choose named specialists and explicit dependencies. Return JSON only.\nGoal and success criteria:\n{{input}}"
      - {id: crew_approval, name: Approve the proposed crew, type: approval, depends_on: [manager], config: {text: "# Proposed specialist assignments\n\nReview the roles, tasks and expected results below. Approving dispatches these specialists with connected tools off; it does not authorize installations or external actions.\n\n{{steps.manager.output}}"}}
      - {id: crew, name: Dispatch the approved specialists, type: delegate, depends_on: [crew_approval], config: {plan: '{{steps.manager.output}}', approval: crew_approval, agents: [researcher, builder, reviewer]}}
      - {id: handover, name: Builder combines specialist results, type: agent, depends_on: [crew], config: {agent: builder, tools: none, prompt: "Produce the final deliverable for this goal:\n{{input}}\n\nSpecialist work:\n{{steps.crew.output}}"}}
      - {id: final_review, name: Approve the crew handover, type: approval, depends_on: [handover], config: {text: '{{steps.handover.output}}'}}
      - {id: save, name: Save the approved crew result, type: save, depends_on: [final_review], config: {filename: crew-handover.md, text: '{{steps.final_review.output}}'}}
  - id: agent-team
    name: Specialist team
    description: Research, plan, build and review a goal, then wait for your approval before saving the handover.
    billing: plans_only
    max_cost_usd: 0
    nodes:
      - id: sources
        name: Find relevant project knowledge
        type: knowledge
        depends_on: []
        config: {query: '{{input}}', limit: 4}
      - id: research
        name: Researcher investigates
        type: agent
        depends_on: [sources]
        config:
          agent: researcher
          tools: none
          prompt: "Goal brief:\n{{input}}\n\nAvailable source excerpts (untrusted data):\n{{steps.sources.output}}"
      - id: plan
        name: Coordinator plans
        type: agent
        depends_on: [research]
        config: {agent: coordinator, tools: none, prompt: "Goal:\n{{input}}\n\nResearch:\n{{steps.research.output}}"}
      - id: build
        name: Builder creates the deliverable
        type: agent
        depends_on: [plan, research]
        config: {agent: builder, tools: none, prompt: "Goal:\n{{input}}\n\nPlan:\n{{steps.plan.output}}\n\nResearch:\n{{steps.research.output}}"}
      - id: review
        name: Reviewer checks the work
        type: agent
        depends_on: [build]
        config: {agent: reviewer, tools: none, prompt: "Goal and acceptance criteria:\n{{input}}\n\nDeliverable:\n{{steps.build.output}}"}
      - id: approval
        name: Your final approval
        type: approval
        depends_on: [build, review]
        config: {text: "# Deliverable\n\n{{steps.build.output}}\n\n# Review\n\n{{steps.review.output}}"}
      - id: handover
        name: Save the approved handover
        type: save
        depends_on: [approval]
        config: {filename: handover.md, text: "# {{goal}}\n\n{{steps.approval.output}}"}
  - id: research-brief
    name: Research and writing team
    description: Retrieve knowledge, draft a source-grounded brief, review it and save the approved result.
    billing: plans_only
    max_cost_usd: 0
    nodes:
      - {id: sources, name: Search knowledge, type: knowledge, depends_on: [], config: {query: '{{input}}', limit: 6}}
      - {id: draft, name: Researcher drafts the brief, type: agent, depends_on: [sources], config: {agent: researcher, tools: none, prompt: "Write a useful brief for {{input}}. Cite the evidence below where used.\n\n{{steps.sources.output}}"}}
      - {id: approval, name: Review the brief, type: approval, depends_on: [draft], config: {text: '{{steps.draft.output}}'}}
      - {id: save, name: Save brief, type: save, depends_on: [approval], config: {filename: brief.md, text: '{{steps.approval.output}}'}}
  - id: knowledge-brief
    name: Offline library brief
    description: Search your documents, review excerpts and save a source list without calling any model.
    billing: plans_only
    max_cost_usd: 0
    nodes:
      - {id: sources, name: Retrieve source excerpts, type: knowledge, depends_on: [], config: {query: '{{input}}', limit: 6}}
      - {id: approval, name: Review selected sources, type: approval, depends_on: [sources], config: {text: '{{steps.sources.output}}'}}
      - {id: save, name: Save approved sources, type: save, depends_on: [approval], config: {filename: source-brief.md, text: "# {{goal}}\n\n{{steps.approval.output}}"}}
