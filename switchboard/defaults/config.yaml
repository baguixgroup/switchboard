# Switchboard node configuration  (one file per machine)
#
# One machine is the HUB: it runs the dashboard, the router, the credit ledger and the
# scheduler. An always-on Raspberry Pi is ideal. Every other machine (Windows PC, Mac)
# runs an AGENT that executes local things for the hub: MCP servers (Unity, Photoshop,
# Blender...), connected phones, installs, and a local copy of every output.
#
# API keys never go in this file: put them in secrets.env next to it.

node:
  name: my-machine                 # unique: windows-pc, macbook, pi ...
  role: hub                        # hub | agent
  hub_url: http://127.0.0.1:8765   # agents: the hub's LAN address, e.g. http://192.168.1.50:8765
  mirror_outputs: true             # agents: also write every task's output into this machine's output folder
  local_dashboard_port: 8766       # agents: open the dashboard at http://localhost:8766 on this machine (no token needed)
  watch_folder: auto               # where to look for images you save from ChatGPT/Grok (auto = your Downloads folder)

server:                            # used by the hub only
  host: 0.0.0.0
  port: 8765
  discovery: true                  # answer "where is the hub?" from computers being set up (UDP, same port)

output_dir: auto                   # auto = ~/Switchboard/Output (Windows, macOS) or ~/switchboard-output (Linux/Pi)

router:
  billing: plans_first             # plans_only = never spend API credit (plans' daily limits, free tiers, local only)
                                   # plans_first = use plans/free first, credit only when no plan can do it or limits are hit
                                   # any = pick on quality vs cost across everything
  mode: balanced                   # balanced | best | cheapest
  classifier: heuristic            # heuristic | llm  (llm = ask the cheapest funded model to classify the task)
  auto_downgrade_effort: false     # true = silently lower a manual effort that is overkill for the task
  confirm_above_usd: 0.50          # ask before running anything estimated above this
  failover: true                   # on rate limit / out of credit / outage: retry with the next best model
  max_tool_rounds: 25
  share_recent_work: true          # tell each task where earlier tasks saved their files, so apps can continue each other's work
  prefer: {}                       # small score bonus per provider, e.g. {anthropic: 0.5, deepseek: 0.3}

permissions:                       # what MODELS may do on their own through tools (you can always do it yourself)
  device_actions: read_only        # none | read_only | all   (read_only = list, screenshot, logs)
  server_actions: read_only        # none | read_only | all   (all = deploy + remote commands)
  install_tools: false
  cli_agents_can_edit: false       # let Claude Code / Codex / Copilot / Gemini CLIs edit files in the task folder

providers:
  anthropic:  {kind: anthropic, api_key_env: ANTHROPIC_API_KEY}
  openai:     {kind: openai_compat, api_key_env: OPENAI_API_KEY, base_url: "https://api.openai.com/v1", max_tokens_param: max_completion_tokens}
  deepseek:   {kind: openai_compat, api_key_env: DEEPSEEK_API_KEY, base_url: "https://api.deepseek.com", balance: deepseek}
  xai:        {kind: openai_compat, api_key_env: XAI_API_KEY, base_url: "https://api.x.ai/v1"}
  gemini:     {kind: openai_compat, api_key_env: GEMINI_API_KEY, base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"}
  github:     {kind: openai_compat, api_key_env: GITHUB_TOKEN, base_url: "https://models.github.ai/inference"}   # GitHub Models (Copilot family)
  openrouter: {kind: openai_compat, api_key_env: OPENROUTER_API_KEY, base_url: "https://openrouter.ai/api/v1", balance: openrouter}
  mistral:    {kind: openai_compat, api_key_env: MISTRAL_API_KEY, base_url: "https://api.mistral.ai/v1"}
  ollama:     {kind: openai_compat, api_key: ollama, base_url: "http://localhost:11434/v1", local: true}

  # Plan CLIs: these sign in with your Claude / ChatGPT / Google / Copilot / SuperGrok account and
  # spend that plan's daily/weekly limits, NOT API credit. Install with `switchboard tools install <id>`
  # on any machine, run the CLI once there to log in, and the hub will use it from that machine.
  claude-code:
    kind: cli
    read_dir_args: ["--add-dir", "{dir}"]        # lets it read earlier tasks' files
    tool_id: claude_code
    command: claude
    args: ["-p", "{prompt}", "--output-format", "json"]
    model_args: ["--model", "{model}"]
    edit_args: ["--permission-mode", "acceptEdits"]
    json_result: result
    json_cost: total_cost_usd
    mcp_style: claude
    login_args: ["auth", "login"]
  codex: &codex_cli
    kind: cli
    tool_id: codex
    command: codex
    args: ["exec", "--skip-git-repo-check", "--output-last-message", "{result_file}"]
    prompt_last: true
    auth_check: ["login", "status"]        # fail fast instead of hanging when not logged in
    auth_check_fail: "not logged in"
    login_args: ["login"]
    model_args: ["-m", "{model}"]
    effort_args: ["-c", "model_reasoning_effort={effort}"]
    image_args: ["-i", "{image}"]
    edit_args: ["--sandbox", "workspace-write"]
    readonly_args: ["--sandbox", "read-only"]
    mcp_style: codex
  codex-images:
    <<: *codex_cli
    required_feature: image_generation
    output_kind: image
    quota_group: codex
    tool_id: codex
  gemini-cli:
    kind: cli
    read_dir_args: ["--include-directories", "{dir}"]        # lets it read earlier tasks' files
    tool_id: gemini_cli
    command: gemini
    args: ["-p", "{prompt}", "--output-format", "json", "--skip-trust"]   # trust only the task folder, this run
    model_args: ["-m", "{model}"]
    edit_args: ["--approval-mode", "auto_edit"]
    json_result: response
    mcp_style: gemini
  copilot-cli:
    kind: cli
    read_dir_args: ["--add-dir", "{dir}"]        # lets it read earlier tasks' files
    tool_id: copilot_cli
    command: copilot
    args: ["-p", "{prompt}", "--silent", "--no-color"]
    model_args: ["--model", "{model}"]
    edit_args: ["--allow-tool", "write"]
    mcp_style: copilot
    login_args: ["login"]
  # Plans whose images are made in their own app: Switchboard opens the app with the prompt copied,
  # then picks up the image you save. Set enabled: false if you don't have that plan.
  claude-app: {kind: handoff, label: Claude, url: "https://claude.ai/", windows_app: Claude, mac_app: Claude, enabled: true}
  chatgpt-app: {kind: handoff, label: ChatGPT, url: "https://chatgpt.com/", windows_app: ChatGPT, mac_app: ChatGPT, enabled: true}
  grok-app:    {kind: handoff, label: Grok, url: "https://grok.com/", windows_app: Grok, mac_app: Grok, enabled: true}
  # Writing services use your own account through an explicit copy/paste handoff.
  grammarly-app: {kind: handoff, task_type: writing, label: Grammarly, url: "https://app.grammarly.com/"}
  quillbot-app: {kind: handoff, task_type: writing, label: QuillBot, url: "https://quillbot.com/"}
  prowritingaid-app: {kind: handoff, task_type: writing, label: ProWritingAid, url: "https://prowritingaid.com/grammar-checker"}
  languagetool-app: {kind: handoff, task_type: writing, label: LanguageTool, url: "https://languagetool.org/"}
  grok-build:                      # xAI's Grok Build CLI (SuperGrok / X Premium+). Check flags with `grok --help`.
    kind: cli
    tool_id: grok_cli
    command: grok
    args: ["-p", "{prompt}"]
    model_args: ["--model", "{model}"]
    login_args: ["auth", "login"]

# MCP servers that run on THIS machine. Browse with `switchboard mcp catalog`,
# add with `switchboard mcp add <name>`. The hub can use servers on every connected agent.
mcp_servers: {}
#  filesystem: {command: npx, args: ["-y", "@modelcontextprotocol/server-filesystem", "~/Projects"]}
#  blender:    {command: uvx, args: ["blender-mcp"]}

# Network devices that cannot run an agent (consoles, TVs). Reachability is checked; see README for limits.
devices: {}
#  ps4: {kind: network, host: 192.168.1.60, probe_port: 9295}

# SSH targets. Uses your normal ssh keys (~/.ssh). Hostinger shared hosting uses port 65002.
servers: {}
#  hostinger: {host: 123.45.67.89, user: u123456789, port: 65002, deploy_path: domains/example.com/public_html}

notify:
  ntfy_topic: ""                   # e.g. switchboard-yourname-8f3k  -> subscribe in the ntfy phone app
  ntfy_server: "https://ntfy.sh"
  check_every_minutes: 30

# Administrator installation routes use SSH keys on this machine, never account passwords in chat.
# Only explicit UI-approved catalog installs can use these connections.
remote_installs: {}
#  windows-admin: {target_node: windows-pc, host: windows, platform: windows, label: Windows administrator SSH}
