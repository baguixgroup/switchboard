<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tazrivo</title>
<meta name="description" content="Your AI models, plans, credits, tools and machines in one place.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#173D35">
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tazrivo">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main">
    <div class="brand"><img src="/static/tazrivo-app.svg" alt=""> <span>Tazrivo</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span class="dot" id="hubDot"></span><span id="hubName" class="grow ellipsis">Connecting…</span></div>
      <button class="sm primary hide" id="installBtn" style="margin-top:10px;width:100%">Install app</button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="modals"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<a href="#laith" class="laith-launcher" aria-label="Talk to Laith, your Atlas lion companion"><img src="/static/laith.png" alt=""><span>Laith</span></a>
<script src="/static/capabilities.js"></script>
<script src="/static/studio.js"></script>
<script src="/static/laith.js"></script>
<script src="/static/voice.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
