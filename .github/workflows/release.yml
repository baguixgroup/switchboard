name: Build installers

# Push a tag like v0.3.0 to build every installer and attach them to a GitHub release.
# "Run workflow" on the Actions tab builds them without releasing (download from the run's artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.13 && uv pip install -e ".[dev,tray]"
      - run: uv run --no-sync pytest -q

  macos:
    needs: test
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bash packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-Setup.exe

  linux:
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-latest]   # arm64 (Raspberry Pi), amd64
    runs-on: ${{ matrix.runner }}
    # Built on Debian Bullseye so the app also runs on older Raspberry Pi OS releases.
    container: debian:bullseye
    steps:
      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates binutils dpkg-dev git >/dev/null
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - uses: actions/checkout@v4
      - run: PATH="$HOME/.local/bin:$PATH" bash packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
