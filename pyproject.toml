[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard-ai"
version = "0.2.0"
description = "One control plane for all your AI models, credits, MCP tools, devices and machines (Windows, macOS, Raspberry Pi)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "anthropic>=2.9",
  "openai>=1.50",
  "mcp>=2.3,<3",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
switchboard = "switchboard.cli:main"

[tool.setuptools.packages.find]
include = ["switchboard*"]

[tool.setuptools.package-data]
switchboard = ["defaults/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
